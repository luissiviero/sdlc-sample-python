underlying item.; Because the design content is otherwise unchanged from the version already reviewed at 0a3163a, the substantive findings from that review still stand: the open concern is a legitimate owner decision point (not itself a design bug) and the risk_list hit is a naive keyword-scan false positive on spec.md's own explanatory text — but neither has been closed by the owner, and clearing parked_reason does not close them."
