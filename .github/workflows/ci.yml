# The project's own CI: the one workflow the SDLC detection counts (build guide step 37,
# decision 15: the first metric is the CI test failure rate). The framework's `SDLC ...`
# workflows are excluded from the metric by design, so without this file the metric has no
# observation at all (found on the first live detection run, 2026-09-25).
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "29 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the toolchain
        run: python -m pip install pytest ruff
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest
