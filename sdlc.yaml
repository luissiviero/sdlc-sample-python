# sdlc.yaml — the project's SDLC framework configuration (written by /sdlc-init).
# Process lives in the pinned plugin; this file is the project content the plugin reads.
# It is a protected path: only the owner edits it, in a reviewed PR.

# --- the gates and judgment calls (OPERATING_MODEL section 3; decisions 18, 21, 30, 32, 37) ---
# One behaviour for every project, with no key to set (decision 37): you merge at (a) intent PR
# and (b) spec+plan PR, and approve at (e) build PR (the merge App merges on that approval,
# decision 36); (c) and (d) are the confidence gate's. The fast lane (decision 30): your own
# intent PR needs no (a) merge (opening it starts the design), and (b) waits for you only on a
# non-routine plan (a routine one goes on to the build; you review intent, spec, plan and code
# at (e)). Inside a phase, a judgment item (an open flagged concern in spec.md, contradicting
# policies, an escalate verdict of the adversarial reviewer, an Important review finding whose
# fix the run cannot determine, a verifier disagreement) goes to a review panel - a reviewer
# and a devil's advocate in blind fresh contexts, then a conciliator that decides - which
# records it in changes/<id>-<slug>/evidence/decisions-<phase>.md; the run continues, you read
# "Decisions taken for you (N)" at the top of the PR at the next human gate, and a review
# comment on any of them overturns it (/sdlc-fix). What never goes to the panel and still
# parks: an escalation on a risk-list item (a hit itself parks nothing, decision 35), a
# guardrail file change, a run limit, an infrastructure failure, a merge to main, a deploy.
# Each panel call counts against gate.max_panel_calls, not the fix iterations. The keys
# `profile` and `review` of older files are no longer read.

# --- feedback loop: one-command targets (build guide step 14; article p.27 step 1) --------
# Each must exit non-zero on failure. /sdlc-init detects them for Python projects.
commands:
  build: "python -m compileall -q ."
  test: "python -m pytest"
  lint: "python -m ruff check ."
  setup: "python -m pip install pytest ruff"
  # the optional fourth target (change 0004): one command that exercises the product headless
  # and writes PNG screenshots and JSON or text state files into the folder named by the
  # environment variable SDLC_PROOF_DIR (the absolute changes/<id>-<slug>/evidence/proof/),
  # with SDLC_CHANGE_ID beside it; it exits non-zero when any step failed. The runner runs it
  # after build, test and lint at the build, test and deploy gates, and the gate compares what it wrote
  # with the plan's `state:` and `screenshot:` proof items. It runs on synthetic data, never
  # personal data. A Playwright test writes its files to process.env.SDLC_PROOF_DIR; a line
  # that names the variable itself is expanded by the platform shell ($SDLC_PROOF_DIR on the
  # Linux runner and by hand on Linux or macOS; %SDLC_PROOF_DIR% by hand under cmd.exe).
  # Empty = no drive.
  drive: ""
  # the repository secrets or variables (names only) the targets need, e.g. [TEST_DB_URL]
  # (R61, plugin 1.0.29). /sdlc-init writes each into the setup and phase steps of the phase
  # workflows, so the setup command, the model's session and the runner's build, test and
  # lint read it. Those run code the session wrote, the targets outside the sandbox: name a
  # test credential here, never a production one. A service a test needs is your edit of the
  # workflow; the model credentials and the GitHub tokens are never passed.
  env: []

# --- phase adapters (OPERATING_MODEL section 9; decision 19) ---------------------------------
deploy:
  # what makes a merged change live: publish package | schedule job | regenerate report |
  # promote to paper trading | deploy service | none
  action: none
  # true turns on the release label at the deploy gate and the production-gate hook (B4)
  production_gate: true
  # the one command the release workflow (.github/workflows/sdlc-release.yml) runs after the
  # owner's merge (and, when production_gate is true, after the release label): e.g.
  # `python -m build && twine upload dist/*`, `python scripts/regenerate_report.py`.
  # Empty = the release is prepared in the PR and nothing runs. Runs on the GitHub runner
  # with the repository's secrets only.
  command: ""
  # command patterns (shell-style globs, case-insensitive, matched against every token suffix
  # of each part of a command, so wrappers such as `python -m`, `nohup` or `bash -c` do not
  # hide one) the production-gate hook blocks inside a Claude session until the
  # release approval exists; added to the plugin's defaults for the adapter
  # (plugin/hooks/production_gate.py DEFAULT_GUARDED) and to the article's own trigger, a
  # command containing both `deploy` and `production` (p.36). `promote to paper trading` has
  # no default: a paper-trading project lists its own promotion command here (e.g.
  # "python scripts/promote.py"). Only read when production_gate is true.
  guarded_commands: []
maintain:
  # the watched metric and where the detection script reads it (default: CI test failure
  # rate from the CI API — decision 15). Bands and the 3-sigma tiers arrive in B5.
  metric: ci_test_failure_rate
  source: github-actions
  # runbooks the 3-sigma tier may call; authorization: allow (CI-scoped, reversible)
  # or ask (touches a running system; waits for the service owner's "Go" as a parked item)
  runbooks:
     - name: rollback-deploy
       command: python -c "print('rollback rehearsal')"
       authorization: ask
       rehearsed_at: 2026-09-25

# --- risk list (build guide step 5; decision 35: a hit is a line of the close-look banner) --
risk_list:
  - auth
  - data migrations
  - money movement
  - production config

# --- guardrails read by the plugin's hooks (build guide step 15) -----------------------------
# Always protected, whatever is listed here: .claude/**, CLAUDE.md, REVIEW.md, sdlc.yaml and
# the plugin's own files. Add generated code, frozen packages, migrations, infra.
protected_paths: []
plan_sync:
  # staged paths matching these globs do not require a plan.md update in phase (c)
  exempt:
    - "*.md"
hooks:
  format_on_edit: true
  # The formatter and linter on each file Claude edits (R33, plugin 1.0.29; one behaviour,
  # always on). An entry maps a glob, or a list of globs, to `fix` commands run in order on
  # the changed file and `check` commands whose exit 1 is fed back to Claude; `{file}` is the
  # file's path from the project root, already quoted for the shell (do not quote it again).
  # The first matching entry wins. A .py or .pyi file no entry matches gets ruff (check
  # --fix, format, check); any other file type with no entry is left alone. A missing tool, any other exit code or a timeout never blocks the edit.
  # In a CI session the project's commands are not run (they run outside the sandbox, on code
  # the session can write); the runner's lint target judges the change there.
  # Keep to what is cheap per file: a whole-project check (clippy, a type check) belongs in
  # commands.lint. /sdlc-init proposed what it found (black, yapf or autopep8 in
  # pyproject.toml; prettier and eslint in package.json; rustfmt for Cargo.toml), e.g.
  #   - glob: ["*.ts", "*.tsx"]
  #     fix: ["npx --no prettier --write {file}", "npx --no eslint --fix {file}"]
  #     check: ["npx --no eslint {file}"]
  formatters: []

# --- pinned process (decision 8) ----------------------------------------------------------
plugin:
  name: sdlc
  marketplace: sdlc-framework
  version: 1.0.47
  # Claude Code CLI version the SDLC workflows install (`npm install -g
  # @anthropic-ai/claude-code@<this>`). `--permission-prompts none` needs 2.1.259 or later;
  # 2.1.304 is the CLI the jobs install and the framework's minimum: the first version read
  # to run a sub-agent on a full model id (the framework's NOTES §54).
  claude_code: "2.1.304"

# --- confidence gate and run limits (build guide steps 16 and 19; decision 11) ---------------
# A gate failure or a limit hit parks the change (label sdlc:needs-human, "What I need from
# you" in the PR) and requests the owner's review on the PR, the only notification (decision 31). A risk-list hit
# does not park (decision 35): the merge of the PR whose banner shows it accepts it. Setting `paused: true` stops every run before it starts.
paused: false

gate:
  max_iterations: 3              # fix iterations per change, one counter across the phases
  max_iterations_non_routine: 2  # when the adversarial reviewer classes the plan non-routine
  max_wall_clock_minutes: 120    # per phase run, from `gate/cli.py start-run`
  max_budget_usd: null           # per change, when the substrate reports spend; null = off
  command_timeout: 900           # seconds per build/test/lint command run by the gate
  max_panel_calls: 4             # panel calls per change under deferred review; not fix iterations
  max_turns: 200                 # turns per session of every run but the build and fix runs
  build_max_turns: 400           # turns of the build run and of every fix round (decision 32)
  build_max_wall_clock_minutes: 180  # wall clock of the build run and of every fix round
                                 # the CI session's Bash timeout (R61). `/sdlc-init` step 4
                                 # sets it to three times the longest target's run
  drive_timeout: 300             # seconds for commands.drive, read only when it is set; at
                                 # most 600 at build and test: with the explain step's 5 minutes
                                 # the test job is 190 + 10 <= 200 and the build and fix jobs
                                 # 250 + 10 <= 260, so a larger value runs at 600 (the reason
                                 # is in the run's JSON); at deploy its minutes come off the
                                 # session's wall clock instead, never below 30
  proof_image_kb: 50             # the largest image the drive may leave under evidence/proof/
                                 # (at most ten a run); read only when commands.drive is set

# --- test-file lock (build guide step 25; OPERATING_MODEL section 8) -------------------------
# Globs of the project's test files. In a fix-type change the build run commits the reproducing
# test first and locks these paths (status.yaml: tests_locked) for the rest of the change; the
# hook denies any edit under them. Defaults per detected language are written by /sdlc-init.
test_paths:
  - "tests/**"
  - "test/**"
  - "**/test_*.py"
  - "**/*_test.py"
  - "**/conftest.py"

# the model alias of the devil's advocate (a panel reduces variance, not bias: three judges
# on one model share its blind spots, so the advocate runs on another model than the
# reviewer); the reviewer and the conciliator inherit the session's model
panel_advocate_model: claude-fable-5-1
adversarial_model: claude-opus-5-5
session_model:
  default: claude-opus-5-5
  design: claude-fable-5-1
second_opinion:
  model: gemini-4-argon
  phases: [design]

# --- the CI session's sandbox (R61, plugin 1.0.29) -------------------------------------------
# allowed_domains: hosts the sandboxed CI session may reach beyond the API, GitHub, PyPI and
# npm (plugin/ci/settings.ci.json), such as the project's package registry; /sdlc-init
# proposed the registries of the languages it found. The session may also run the commands
# above: their Bash allow rules follow commands.build, test, lint and setup.
sandbox:
  allowed_domains: []
